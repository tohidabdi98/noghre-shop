security: []
  # - "npx audit-ci --moderate"
  # - "python -m pip_audit"
  # - "gitleaks detect --no-banner"

notes: |
  Fill these in during the architecture phase. Until then `verify.py` auto-detects the stack
  (node/go/rust/python) and reports exactly what it did and did not run.
