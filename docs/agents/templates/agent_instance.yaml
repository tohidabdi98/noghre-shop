# Agent instance record — append to `agents:` in state/agents.yaml
#
# One entry per agent *instance* (not per role). Instances are cheap: create one whenever a
# session starts, replace one whenever a session dies. The record is what makes agent work
# auditable and makes agent replacement lossless.
#
  - agent_id: impl-auth-001          # <role-prefix>-<slug>-<sequence>, unique forever
    name: Authentication Implementation Agent
    role: implementation             # must exist in docs/agents/agent_registry.yaml
    category: implementation
    module_id: AUTH-001              # null for roles not bound to a module
    project_id: "noghre-shop"
    branch: agent/impl-auth-001/AUTH-001
    status: active                   # planned|active|waiting|blocked|replacing|replaced|done|failed
    current_task: "Implement password reset flow (AC-3, AC-4)"
    parent_agent: null               # set on replacements: the agent this one continues
    replaced_by: null                # set when this instance is retired
    created_at: 2026-01-01
    updated_at: 2026-01-01
    context_pack: state/.cache/context/AUTH-001-impl-auth-001.md   # generated, not committed
    tools: [read_repo, write_code, run_local_commands, create_branch, create_commit, create_pull_request]
    authority:
      - modify assigned module
      - create tests
      - create commits
      - create pull request
    validation:                      # what this instance has actually proven
      - command: python scripts/verify.py
        result: exit 0
    notes: ""
    history:
      - at: 2026-01-01
        event: created
        detail: assigned from state/modules.yaml (status ready -> assigned)
